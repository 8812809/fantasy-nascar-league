<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archive | Fantasy NASCAR League</title>
<style>
:root{--bg:#f4f4f4;--text:#222;--soft:#fff7d6;--border:#ddd;--gold:#d6a600;--muted:#666}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;font-size:17px}
header{background:#111;color:#fff;padding:18px 16px;text-align:center}header h1{margin:0}
.menu-wrap{background:#222;padding:10px 16px}details.menu{max-width:560px;margin:auto}
details.menu>summary{cursor:pointer;color:#fff;font-weight:bold;font-size:1.25rem;padding:15px 20px;background:#333;border-radius:10px;text-align:center;list-style:none}
nav{margin-top:8px;background:#fff;border-radius:8px;overflow:hidden}nav a{display:block;padding:15px 18px;color:#111;text-decoration:none;border-bottom:1px solid #eee;font-weight:bold}nav a.active{background:var(--soft)}
main{max-width:1100px;margin:auto;padding:18px 14px 40px}.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:0 2px 8px #0002}
h2{margin-top:0;border-bottom:3px solid #111;padding-bottom:8px}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:10px;border:1px solid var(--border);text-align:left;white-space:nowrap}th{background:#111;color:#fff}tr:nth-child(even){background:#fafafa}
.right{text-align:right}.center{text-align:center}.champion-box{background:var(--soft);border:2px solid var(--gold);border-radius:12px;padding:16px;text-align:center;font-weight:bold;font-size:1.1rem}
.race-head{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center}.winner-note{font-weight:bold}.footer{text-align:center;color:#666;padding:20px 14px 30px;border-top:1px solid #ddd}
</style></head><body>
<header><h1>Archive</h1><p>2026 Segment 2 — race-by-race standings history</p></header>
<div class="menu-wrap"><details class="menu"><summary>☰ Menu</summary><nav>
<a href="index.html">Home</a><a href="standings.html">Standings</a><a href="teams.html">Teams</a><a href="results.html">Race Results</a><a href="schedule.html">Schedule</a><a class="active" href="archive.html">Archive</a><a href="rules.html">Rules</a><a href="history.html">History</a>
</nav></details></div>
<main>
<section class="card"><h2>2026 Segment 2</h2><div id="champ" class="champion-box">Loading...</div></section>
<div id="snapshots">Loading standings history...</div>
</main>
<div class="footer">Fantasy NASCAR League is an independent private fantasy league site.</div>
<script src="league-data.js?v=20260909-archive-standings-fix2"></script>
<script>
(function(){
 const d=window.LEAGUE_DATA, a=d&&d.archive&&d.archive['2026_segment_2'];
 if(!a){document.getElementById('champ').textContent='Archive data unavailable.';document.getElementById('snapshots').innerHTML='';return;}
 document.getElementById('champ').textContent='Segment 2 Champion: '+a.champion+' — '+a.champion_points+' Segment Points';
 const fmtWins=n=>Number.isInteger(n)?n:(Math.round(n*10)/10);
 document.getElementById('snapshots').innerHTML=a.standings_snapshots.map(s=>`
   <section class="card">
    <div class="race-head">
      <h2>After Race ${s.race_number}: ${s.race}</h2>
      <div class="winner-note">Weekly Side Bet Winner: ${s.weekly_winner.replaceAll('Team ','')} — ${s.winning_score}</div>
    </div>
    <div class="scroll"><table>
      <thead><tr><th>Rank</th><th>Team</th><th>Race Points</th><th>Segment Points</th><th>Behind</th><th>Weekly Wins</th></tr></thead>
      <tbody>${s.standings.map(r=>`<tr><td class="center">${r.rank}</td><td>${r.display_name}</td><td class="right">${r.weekly_points}</td><td class="right"><strong>${r.segment_points}</strong></td><td class="right">${r.behind===0?'Leader':r.behind}</td><td class="center">${fmtWins(r.weekly_wins)}</td></tr>`).join('')}</tbody>
    </table></div>
   </section>`).join('');
})();
</script></body></html>
