<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archive | Fantasy NASCAR League</title><style>

<script src="league-data.js?v=20260915-seg3-r4-wwtr"></script><script>(function(){const d=window.LEAGUE_DATA,a=d&&d.archive&&d.archive['2026_segment_2'];if(!a)return;champ.textContent=`Segment 2 Champion: ${a.champion} — ${a.champion_points} Segment Points`;races.innerHTML=a.standings_snapshots.map(s=>`<details class="race"><summary>Race ${s.race_number}: ${s.race}</summary><div class="inside"><p><strong>Weekly Side Bet Winner:</strong> ${s.weekly_winner.replaceAll('Team ','')} — ${s.winning_score} points</p><div class="scroll"><table><thead><tr><th>Rank</th><th>Team</th><th>Race Points</th><th>Segment Points</th><th>Behind</th><th>Weekly Wins</th></tr></thead><tbody>${s.standings.map(r=>`<tr class="${r.rank===1?'leader':''}"><td class="center">${r.rank}</td><td>${r.display_name}</td><td class="right">${r.weekly_points}</td><td class="right">${r.segment_points}</td><td class="right">${r.behind===0?'Leader':r.behind}</td><td class="center">${Number.isInteger(r.weekly_wins)?r.weekly_wins:Math.round(r.weekly_wins*10)/10}</td></tr>`).join('')}</tbody></table></div></div></details>`).join('');})();</script></body></html>
