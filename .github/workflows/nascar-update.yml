name: Fantasy NASCAR Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  step-5b-jayski-access-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Fantasy NASCAR repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate current live league data
        run: python automation/validate_live_data.py league-data.js

      - name: Test Jayski access and discover Las Vegas resources
        run: python automation/fetch_jayski_results.py --race-number 31 --track "Las Vegas Motor Speedway" --output "automation/test-data/jayski-las-vegas-discovery.json"

      - name: Confirm Jayski discovery file exists
        run: |
          test -f automation/test-data/jayski-las-vegas-discovery.json
          echo "Jayski discovery file created."

      - name: Step 5B passed
        run: |
          echo "Fantasy NASCAR Step 5B Jayski access test passed."
          echo "GitHub Actions can reach Jayski and identify the Las Vegas race resources."
          echo "LIVE WEBSITE WAS NOT MODIFIED."
