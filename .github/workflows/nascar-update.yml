name: Fantasy NASCAR Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-calculation-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Fantasy NASCAR repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reproduce Las Vegas results
        run: |
          python automation/verify_las_vegas.py

      - name: Validate live league data
        run: |
          python automation/validate_live_data.py league-data.js

      - name: Step 4A passed
        run: |
          echo "Calculation engine passed."
          echo "Live league-data.js validation passed."
          echo "Fantasy NASCAR Step 4A completed successfully."
