name: Fantasy NASCAR Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  step-4b-dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Fantasy NASCAR repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reproduce Las Vegas calculation
        run: |
          python automation/verify_las_vegas.py

      - name: Validate current live league data
        run: |
          python automation/validate_live_data.py league-data.js

      - name: Generate Las Vegas from Kansas baseline
        run: |
          python automation/generate_step4b.py

      - name: Confirm generated file exists
        run: |
          test -f automation/generated/league-data.js
          echo "Generated league-data.js found successfully."

      - name: Validate generated league data
        run: |
          python automation/validate_live_data.py automation/generated/league-data.js

      - name: Compare generated data with live Las Vegas
        run: |
          python automation/compare_generated_to_live.py

      - name: Step 4B passed
        run: |
          echo "Fantasy NASCAR Step 4B passed."
          echo "Calculation engine generated Las Vegas successfully."
          echo "Generated data passed live-data validation."
          echo "Generated data matched the approved Las Vegas data."
          echo "LIVE WEBSITE WAS NOT MODIFIED."
