name: Fantasy NASCAR Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  step-5-online-import-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Fantasy NASCAR repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install online-data requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validate current live league data
        run: |
          python automation/validate_live_data.py league-data.js

      - name: Fetch NASCAR Las Vegas results online
        run: |
          python automation/fetch_nascar_results.py \
            --year 2026 \
            --cup-race-number 31 \
            --fantasy-race-number 7 \
            --name "Las Vegas Motor Speedway" \
            --date "2026-10-04" \
            --next-race "Charlotte Motor Speedway" \
            --output "automation/test-data/online-las-vegas.json
      - name: Compare online results with approved Las Vegas input
        run: |
          python automation/compare_online_las_vegas.py

      - name: Generate league data from online race input
        run: |
          python automation/generate_step4b.py

      - name: Confirm generated file exists
        run: |
          test -f automation/generated/league-data.js
          echo "Generated league-data.js found successfully."

      - name: Validate generated league data
        run: |
          python automation/validate_live_data.py automation/generated/league-data.js

      - name: Compare generated league data with approved Las Vegas
        run: |
          python automation/compare_generated_to_live.py

      - name: Step 5 passed
        run: |
          echo "Fantasy NASCAR Step 5 passed."
          echo "NASCAR race results were obtained online."
          echo "Online race data matched the approved Las Vegas race input."
          echo "League calculations passed."
          echo "Generated league data passed validation."
          echo "LIVE WEBSITE WAS NOT MODIFIED."
