<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Race Results | Fantasy NASCAR League</title><style>:root{--bg:#f4f4f4;--text:#222;--dark:#111;--mid:#222;--soft:#fff7d6;--border:#ddd;--muted:#666;--green:#e6f7ea;--red:#fde8e8;--gold:#d6a600}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;font-size:17px}header{background:#111;color:#fff;padding:18px 16px;text-align:center}header h1{margin:0;font-size:1.9rem}header p{margin:6px 0 0;color:#ddd}.menu-wrap{background:#222;padding:10px 16px}details.menu{max-width:560px;margin:auto}details.menu>summary{cursor:pointer;color:#fff;font-weight:bold;font-size:1.25rem;padding:15px 20px;background:#333;border-radius:10px;text-align:center;list-style:none}nav{margin-top:8px;background:#fff;border-radius:8px;overflow:hidden;border:1px solid var(--border)}nav a{display:block;padding:15px 18px;color:#111;text-decoration:none;border-bottom:1px solid #eee;font-weight:bold}nav a:hover,nav a.active{background:var(--soft)}main{max-width:1100px;margin:auto;padding:18px 14px 40px}.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:0 2px 8px #0002}h2{margin-top:0;border-bottom:3px solid #111;padding-bottom:8px}h3{margin:14px 0 8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:14px}.mini-card{background:#fafafa;border:1px solid var(--border);border-radius:10px;padding:14px}.button-link{display:inline-block;background:#111;color:#fff;text-decoration:none;padding:11px 15px;border-radius:8px;margin:4px;font-weight:bold}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:10px;border:1px solid var(--border);text-align:left;vertical-align:top}th{background:#111;color:#fff}tr:nth-child(even){background:#fafafa}.right{text-align:right}.center{text-align:center}.winner{background:var(--green)!important;font-weight:bold}.muted{color:var(--muted)}.note{background:var(--soft);border:1px solid var(--gold);border-radius:10px;padding:13px}.error{background:var(--red);padding:12px;border-radius:8px}.roster{list-style:none;padding:0;margin:8px 0}.roster li{border-bottom:1px solid #eee;padding:8px 0}.car{font-weight:bold;color:#555}.team-card h3{font-size:1.2rem;margin-top:0}.team-details{border:1px solid var(--border);border-radius:9px;margin:10px 0;overflow:hidden}.team-details>summary{font-weight:bold;padding:12px 14px;background:#f1f1f1;cursor:pointer}.team-details .scroll{padding:0 12px 12px}.team-total td{font-weight:bold;background:#f7f7f7}.champion-box{background:var(--soft);border:2px solid var(--gold);border-radius:12px;padding:16px;text-align:center;font-weight:bold;font-size:1.1rem}.footer{text-align:center;color:#666;padding:20px 14px 30px;border-top:1px solid #ddd}@media(max-width:600px){body{font-size:16px}header h1{font-size:1.65rem}main{padding:14px 10px 32px}th,td{padding:9px;font-size:.94rem}.card{padding:14px}}</style></head><body><header><h1>Race Results</h1><p>Segment 3 weekly team scores and driver-car breakdowns.</p></header><div class="menu-wrap"><details class="menu"><summary>☰ Menu</summary><nav><a class="" href="index.html">Home</a><a class="" href="standings.html">Standings</a><a class="" href="teams.html">Teams</a><a class="active" href="results.html">Race Results</a><a class="" href="schedule.html">Schedule</a><a class="" href="archive.html">Archive</a><a class="" href="rules.html">Rules</a><a class="" href="history.html">History</a></nav></details></div><main><section class="card"><h2>Race Results Summary</h2><p id="updated" class="muted"></p><div id="nav"></div></section><div id="area"></div></main><div class="footer">Fantasy NASCAR League is an independent private fantasy league site. NASCAR and driver/team names are property of their respective owners.</div><script src="league-data.js?v=20260921-seg3-r5-bristol"></script><script>(function(){const d=window.LEAGUE_DATA;if(!d)return;updated.textContent=`Updated through ${d.current_race}.`;const races=d.races.filter(r=>/completed/i.test(r.status||''));nav.innerHTML=races.map(r=>`<a class="button-link" href="#race-${r.race_number}">Race ${r.race_number}: ${r.name}</a>`).join('');area.innerHTML=races.map(r=>{const det=d.race_results[r.name]||{},rows=(det.team_breakdown||[]).slice().sort((a,b)=>a.rank-b.rank||a.team_id-b.team_id);const sr=rows.map(t=>`<tr class="${t.rank===1?'winner':''}"><td>${t.rank}</td><td>${t.display_name}</td><td class="right">${t.qualifying_points}</td><td class="right">${t.race_points}</td><td class="right">${t.weekly_total}</td></tr>`).join('');const bd=rows.map(t=>`<details class="team-details" ${t.rank===1?'open':''}><summary>${t.display_name} — ${t.weekly_total} points</summary><div class="scroll"><table><thead><tr><th>Car</th><th>Driver</th><th>Start</th><th>Qualifying Points</th><th>Finish</th><th>Race Points</th><th>Total</th></tr></thead><tbody>${t.drivers.map(x=>`<tr><td>#${x.car}</td><td>${x.driver}</td><td class="right">${x.start}</td><td class="right">${x.qualifying_points}</td><td class="right">${x.finish}</td><td class="right">${x.race_points}</td><td class="right">${x.total}</td></tr>`).join('')}<tr class="team-total"><td colspan="3">Team Total</td><td class="right">${t.qualifying_points}</td><td></td><td class="right">${t.race_points}</td><td class="right">${t.weekly_total}</td></tr></tbody></table></div></details>`).join('');return `<section class="card" id="race-${r.race_number}"><h2>Race ${r.race_number}: ${r.name}</h2><p><strong>Weekly Side Bet Winner:</strong> ${r.weekly_winner} — ${r.winning_score} points</p><div class="scroll"><table><thead><tr><th>Rank</th><th>Team</th><th>Qualifying Points</th><th>Race Points</th><th>Total</th></tr></thead><tbody>${sr}</tbody></table></div><h3>Team Driver-Car Breakdown</h3>${bd}</section>`}).join('');})();</script></body></html>
